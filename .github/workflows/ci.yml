name: CI

on:
  push:
    # This repo's default branch is master, not main. Both are listed so a
    # future default-branch rename doesn't silently disable CI again.
    branches: [main, master]
  pull_request:

# No secrets are used by this workflow and none should be added. Everything here
# runs against generated Prisma types and a throwaway URL.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        # Prisma needs a syntactically valid URL to generate types. It does not
        # connect, and this value is not a credential.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run db:generate

      - name: Typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate compose file
        run: docker compose -f infra/compose.yaml config --quiet
        env:
          APP_URL: http://localhost:8080
          SITE_HOST: localhost
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          SESSION_SECRET: ci
          MASTER_KEY: ci

      - name: Build images
        # `config --quiet` validates YAML only; a Dockerfile that cannot build
        # sails through it. Actually building both images is what catches a bad
        # COPY path, a broken standalone layout, or a compile error at the
        # image boundary — the exact class of defect the first audit found.
        run: docker compose -f infra/compose.yaml build web worker
        env:
          APP_URL: http://localhost:8080
          SITE_HOST: localhost
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          SESSION_SECRET: ci
          MASTER_KEY: ci
