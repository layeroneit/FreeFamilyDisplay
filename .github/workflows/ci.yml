name: CI

on:
  push:
    # This repo's default branch is master, not main. Both are listed so a
    # future default-branch rename doesn't silently disable CI again.
    branches: [main, master]
  pull_request:

# No secrets are used by this workflow and none should be added. Everything here
# runs against generated Prisma types and a throwaway URL.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        # Prisma needs a syntactically valid URL to generate types. It does not
        # connect, and this value is not a credential.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run db:generate

      - name: Typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Apply migrations to the CI database
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run db:deploy

      - name: First-run bootstrap test (real Postgres, empty user table)
        # ADR 0004: the /welcome door must close after the first account, and
        # must close exactly once under two simultaneous submissions. The test
        # needs a database with ZERO users, which is only true right after
        # migrations — so it runs HERE, before the tenancy test creates any. It
        # skips rather than failing when the table is non-empty, so it can
        # never delete somebody's accounts to make room for itself.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run test:bootstrap

      - name: Cross-tenant isolation test (real Postgres)
        # CLAUDE.md: the tenancy test is not optional. It runs against the
        # migrated service database, never against anything shared.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run test:db

      - name: Validate compose file
        run: docker compose -f infra/compose.yaml config --quiet
        env:
          APP_URL: http://localhost:8080
          SITE_HOST: localhost
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          SESSION_SECRET: ci
          MASTER_KEY: ci

      - name: Build images
        # `config --quiet` validates YAML only; a Dockerfile that cannot build
        # sails through it. Actually building both images is what catches a bad
        # COPY path, a broken standalone layout, or a compile error at the
        # image boundary — the exact class of defect the first audit found.
        run: docker compose -f infra/compose.yaml build web worker
        env:
          APP_URL: http://localhost:8080
          SITE_HOST: localhost
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          SESSION_SECRET: ci
          MASTER_KEY: ci
