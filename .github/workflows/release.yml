# Publishes the web and worker images to GitHub Container Registry on a tag.
#
# Why this exists: the README's quick start ends with `up -d --build`, which
# means every family waits several minutes for `npm ci` and `next build` on
# whatever mini-PC they had spare. Publishing the images turns that into a
# pull. It is the single biggest piece of install friction in the project.
#
# Built natively on BOTH architectures rather than under QEMU. arm64 hosted
# runners are free for public repositories, and a Next.js build under
# qemu-user-static takes hours rather than minutes -- the difference between a
# release you can cut on a whim and one you schedule around.
#
# Each architecture is built and pushed by digest, then a manifest list is
# assembled from those digests. That is the documented buildx pattern for
# multi-arch without QEMU.

name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.component }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [web, worker]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.component }}.Dockerfile
          platforms: ${{ matrix.platform }}
          # Push without a tag; the merge job below turns the digests into one
          # multi-arch tag. Tagging here would have the two architectures
          # racing to overwrite each other.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.component }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.component }}-${{ matrix.arch }}
          retention-days: 1

  merge:
    name: publish ${{ matrix.component }} manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [web, worker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}-${{ matrix.component }}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          TAG="${GITHUB_REF_NAME}"
          REFS=""
          for f in /tmp/digests/*; do
            REFS="$REFS ${IMAGE}@$(cat "$f")"
          done
          echo "Assembling $IMAGE:$TAG from:$REFS"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" $REFS
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
